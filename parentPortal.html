<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Finance Portal — Sacred Heart College</title>
  <style>
    :root {
      --brand:#1e3a5f; --brand2:#2563eb; --gold:#c8972b;
      --success:#16a34a; --warn:#d97706; --danger:#dc2626;
      --bg:#f8fafc; --border:#e2e8f0; --text:#111827; --muted:#6b7280;
      --radius:12px; --shadow:0 2px 12px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* ── topbar ── */
    .topbar{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
      padding:.85rem 1.5rem;display:flex;align-items:center;justify-content:space-between;
      gap:.75rem;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    .tb-brand{display:flex;align-items:center;gap:.75rem}
    .tb-logo{width:38px;height:38px;border-radius:50%;object-fit:contain;border:1.5px solid rgba(255,255,255,.4)}
    .tb-brand h1{font-size:.95rem;font-weight:700}
    .tb-brand p{font-size:.72rem;opacity:.8}
    .tb-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
    .btn-tb{padding:.38rem .9rem;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;text-decoration:none}
    .btn-tb-ghost{background:rgba(255,255,255,.18);color:#fff}
    .btn-tb-white{background:#fff;color:var(--brand)}

    /* ── layout ── */
    .layout{display:flex;min-height:calc(100vh - 56px)}
    .sidebar{width:250px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
    .main{flex:1;padding:1.5rem;overflow-y:auto;max-width:1100px}

    /* ── sidebar ── */
    .stu-picker-wrap{padding:.85rem;border-bottom:1px solid var(--border)}
    .stu-picker-wrap label{font-size:.73rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.35rem}
    .stu-picker-wrap select{width:100%;padding:.5rem .75rem;border:1.5px solid var(--border);border-radius:8px;font-size:.84rem;outline:none;background:#fff}
    .stu-picker-wrap select:focus{border-color:var(--brand2)}

    .stu-card{padding:1.1rem;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#eff6ff,#f0fdf4);display:none}
    .stu-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;font-size:1.1rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:.5rem}
    .stu-name{font-size:.95rem;font-weight:700;margin-bottom:.1rem}
    .stu-meta{font-size:.75rem;color:var(--muted)}
    .balance-pill{display:inline-block;margin-top:.4rem;padding:.2rem .65rem;border-radius:9999px;font-size:.73rem;font-weight:700}
    .pill-ok{background:#dcfce7;color:#166534}
    .pill-owed{background:#fee2e2;color:#991b1b}

    .sfp-nav{padding:.5rem 0;flex:1}
    .nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem 1.1rem;cursor:pointer;
      font-size:.85rem;color:var(--muted);border-left:3px solid transparent;transition:all .15s}
    .nav-item:hover{background:var(--bg);color:var(--brand)}
    .nav-item.active{background:#eff6ff;color:var(--brand);border-left-color:var(--brand2);font-weight:600}
    .nav-badge{background:var(--danger);color:#fff;font-size:.63rem;font-weight:700;border-radius:9999px;padding:.1rem .4rem;margin-left:auto}

    /* ── cards & tables ── */
    .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.1rem}
    .card-hdr{padding:.9rem 1.2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
    .card-hdr h3{font-size:.92rem;font-weight:700;color:var(--brand)}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.75rem;margin-bottom:1.1rem}
    .stat-card{background:#fff;border-radius:var(--radius);padding:.9rem 1rem;box-shadow:var(--shadow);border-left:4px solid var(--brand2)}
    .stat-val{font-size:1.35rem;font-weight:700;margin-bottom:.1rem}
    .stat-lbl{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase}

    table{width:100%;border-collapse:collapse;font-size:.83rem}
    th{padding:.55rem .9rem;text-align:left;font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;background:#f9fafb;border-bottom:1px solid var(--border)}
    td{padding:.6rem .9rem;border-bottom:1px solid #f3f4f6}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#fafafa}

    /* ── badges ── */
    .badge{display:inline-block;border-radius:9999px;padding:.18rem .6rem;font-size:.72rem;font-weight:700}
    .b-paid{background:#dcfce7;color:#166534}
    .b-partial{background:#fef3c7;color:#92400e}
    .b-unpaid{background:#fee2e2;color:#991b1b}
    .b-waived{background:#f3f4f6;color:var(--muted)}
    .b-charge{background:#eff6ff;color:#1d4ed8}
    .b-payment{background:#f0fdf4;color:#166534}
    .b-adj{background:#faf5ff;color:#7c3aed}

    /* ── buttons ── */
    .btn{display:inline-flex;align-items:center;gap:.3rem;padding:.42rem .9rem;border:none;border-radius:8px;
      cursor:pointer;font-size:.8rem;font-weight:600;transition:opacity .15s;text-decoration:none}
    .btn:hover{opacity:.85}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-success{background:var(--success);color:#fff}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-secondary{background:var(--bg);color:var(--muted);border:1.5px solid var(--border)}
    .btn-warning{background:var(--warn);color:#fff}
    .btn-ghost{background:transparent;color:var(--brand2);border:1.5px solid var(--brand2)}
    .btn-sm{padding:.28rem .6rem;font-size:.76rem}

    /* ── forms ── */
    .fg{margin-bottom:.75rem}
    .fg label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.28rem}
    .fg input,.fg select,.fg textarea{width:100%;padding:.5rem .8rem;border:1.5px solid var(--border);
      border-radius:8px;font-size:.875rem;outline:none;font-family:inherit}
    .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand2)}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}

    /* ── modal ── */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;place-items:center;padding:1rem}
    .modal.open{display:grid}
    .modal-box{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:90vh;
      overflow-y:auto;padding:1.6rem;box-shadow:0 24px 60px rgba(0,0,0,.22)}
    .modal-box h3{font-size:1rem;font-weight:700;color:var(--brand);margin-bottom:1rem}
    .modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}

    /* ── misc ── */
    .empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
    .empty-ico{font-size:2.5rem;margin-bottom:.5rem}
    .loading{text-align:center;padding:2rem;color:var(--muted)}
    .section-title{font-size:1.05rem;font-weight:700;color:var(--brand);margin-bottom:1rem}
    .viewonly-banner{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:.6rem 1rem;
      margin-bottom:1rem;font-size:.82rem;color:#92400e;display:flex;align-items:center;gap:.5rem}

    .toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.4rem}
    .toast{background:#1e293b;color:#fff;padding:.6rem 1rem;border-radius:9px;font-size:.83rem;font-weight:500;
      animation:toastIn .2s ease}
    @keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    .ledger-debit{color:var(--danger);font-weight:600}
    .ledger-credit{color:var(--success);font-weight:600}
    .balance-row{font-weight:700}

    /* ── parent portal specific ── */
    .parent-login-wrap{max-width:480px;margin:3rem auto;padding:0 1rem}
    .parent-login-card{background:#fff;border-radius:16px;padding:2rem;box-shadow:var(--shadow)}
    .parent-login-card h2{font-size:1.1rem;font-weight:800;color:var(--brand);margin-bottom:.35rem}
    .parent-login-card p{font-size:.85rem;color:var(--muted);margin-bottom:1.25rem}

    @media(max-width:680px){
      .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border)}
      .layout{flex-direction:column}
      .frow{grid-template-columns:1fr}
    }
    @media print{
      .topbar,.sidebar,.no-print{display:none!important}
      .main{padding:0;max-width:100%}
      .layout{display:block}
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-brand">
    <img class="tb-logo" src="images/sahaco logo.jpg" alt="SAHARCO" onerror="this.style.display='none'">
    <div>
      <h1 id="top-school-name">Sacred Heart College Eziukwu Aba</h1>
      <p id="top-role-label">Student Finance Portal</p>
    </div>
  </div>
  <div class="tb-actions no-print">
    <a href="dashboard.html" class="btn-tb btn-tb-ghost">← Dashboard</a>
    <button class="btn-tb btn-tb-white" onclick="window.print()">🖨 Print</button>
    <button class="btn-tb btn-tb-ghost" id="btn-export" style="display:none" onclick="doExport()">⬇ Export CSV</button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="stu-picker-wrap no-print" id="picker-wrap">
      <label>Select Student</label>
      <select id="stu-picker" onchange="selectStudent(this.value)">
        <option value="">Loading…</option>
      </select>
    </div>

    <div class="stu-card" id="stu-card">
      <div class="stu-avatar" id="stu-avatar">—</div>
      <div class="stu-name"  id="stu-name">—</div>
      <div class="stu-meta"  id="stu-meta">—</div>
      <div id="stu-balance"></div>
    </div>

    <nav class="sfp-nav" id="sfp-nav">
      <div class="nav-item active" data-view="overview"   onclick="switchView('overview')"><span>📊</span> Overview</div>
      <div class="nav-item"        data-view="charges"    onclick="switchView('charges')"><span>⚡</span> Charges <span id="badge-unpaid" class="nav-badge" style="display:none"></span></div>
      <div class="nav-item"        data-view="payments"   onclick="switchView('payments')"><span>💳</span> Payments</div>
      <div class="nav-item"        data-view="levies"     onclick="switchView('levies')"><span>🎯</span> Levies</div>
      <div class="nav-item"        data-view="ledger"     onclick="switchView('ledger')"><span>📒</span> Ledger</div>
      <!-- Staff/Admin only below -->
      <div class="nav-item edit-only" data-view="bursar"  onclick="switchView('bursar')"><span>⚙️</span> Bursar Tools</div>
      <div class="nav-item edit-only" data-view="class"   onclick="switchView('class')"><span>🏫</span> Class Finance</div>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main" id="sfp-main">
    <div class="empty"><div class="empty-ico">👈</div><p>Select a student to view their financial records.</p></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- TOASTS -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   STUDENT FINANCE PORTAL  v3
═══════════════════════════════════════════════════════════ */
const API      = window.__ENV__?.API_URL || 'https://rms-bckend.onrender.com/api';
const getToken = () => sessionStorage.getItem('shc_token');

const $ = id => document.getElementById(id);
const fmt = n => '₦' + parseFloat(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}) : '—';
const badge = (s) => {
  const m = {Paid:'b-paid',Partial:'b-partial',Unpaid:'b-unpaid',Waived:'b-waived',
             charge:'b-charge',payment:'b-payment',adjustment:'b-adj',refund:'b-adj'};
  return `<span class="badge ${m[s]||'b-unpaid'}">${s}</span>`;
};

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeft = `3px solid ${type==='success'?'#22c55e':type==='error'?'#ef4444':type==='warning'?'#f59e0b':'#3b82f6'}`;
  el.textContent = msg;
  $('toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}
function showModal(html){ $('modal-box').innerHTML=html; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }

/* ── State ── */
let _student=null, _view='overview', _role='', _wardId=null, _info={};
const canEdit  = ()=>['Admin','Bursar'].includes(_role);
const canAdmin = ()=>_role==='Admin';
const isParent = ()=>_role==='Parent';

/* ═══════════════════════════════════════════════════════════
   API HELPERS
═══════════════════════════════════════════════════════════ */
async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json' };
  const token = getToken();
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const r = await fetch(API + path, {
    ...opts, credentials:'include', headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(()=>({success:false,message:'Invalid JSON'}));
  if (!data.success) throw new Error(data.message || `HTTP ${r.status}`);
  return data;
}

/* ═══════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════ */
async function boot() {
  const token = getToken();
  const session = JSON.parse(sessionStorage.getItem('shc_session')||'null');
  _role   = session?.role   || '';
  _wardId = session?.wardId || session?.ward_id || null;

  /* ── Parent login form (no token) ── */
  if (!token || !_role) {
    showParentLoginForm();
    return;
  }

  /* ── Role badge in topbar ── */
  const roleColor = {Admin:'#dc2626',Bursar:'#7c3aed',Teacher:'#2563eb',Staff:'#0891b2',Parent:'#16a34a'}[_role]||'#6b7280';
  $('top-role-label').innerHTML = `Student Finance Portal &nbsp;<span style="background:${roleColor};color:#fff;border-radius:5px;padding:.1rem .5rem;font-size:.68rem;font-weight:700;">${_role}</span>`;

  /* ── Hide edit-only UI for view-only roles ── */
  if (!canEdit()) {
    const s = document.createElement('style');
    s.textContent = '.edit-only{display:none!important}';
    document.head.appendChild(s);
  }

  /* ── Load school info ── */
  const si = await api('/admin/').catch(()=>null);
  _info = si?.data || { school_name:'Sacred Heart College Eziukwu Aba',
    current_term: session?.term||'', current_session: session?.session||'' };
  $('top-school-name').textContent = _info.school_name || 'Sacred Heart College Eziukwu Aba';

  /* ── Parent: show only their ward ── */
  if (isParent()) {
    $('picker-wrap').style.display = 'none';
    const ward = _wardId || new URLSearchParams(location.search).get('studentId');
    if (ward) { selectStudent(decodeURIComponent(ward)); }
    else { $('sfp-main').innerHTML = `<div class="empty"><div class="empty-ico">🔒</div><p>No ward linked. Contact the school administrator.</p></div>`; }
    return;
  }

  /* ── Staff: load all students into picker ── */
  try {
    const resp = await api('/students');
    const list = (resp.data||[]).sort((a,b)=>a.name.localeCompare(b.name));
    $('stu-picker').innerHTML = '<option value="">— Select a student —</option>' +
      list.map(s=>`<option value="${s.id}">${s.name} — ${s.class||s.class_name||''} ${s.arm||''} (${s.id})</option>`).join('');

    /* auto-select from URL */
    const pid = decodeURIComponent(new URLSearchParams(location.search).get('studentId')||'').trim();
    if (pid) {
      const match = list.find(s=>s.id===pid||s.id?.toLowerCase()===pid.toLowerCase());
      const id = match?.id || pid;
      $('stu-picker').value = id;
      selectStudent(id);
    }
    $('btn-export').style.display = '';
  } catch(e) { toast('Failed to load students: '+e.message,'error'); }
}

/* ── Parent login form (no session) ── */
function showParentLoginForm() {
  $('picker-wrap').style.display = 'none';
  document.querySelector('.layout').innerHTML = `
    <div class="parent-login-wrap">
      <div class="parent-login-card">
        <h2>👨‍👩‍👧 Parent / Guardian Portal</h2>
        <p>Enter your child's Student ID and your registered phone number to view their financial records.</p>
        <div class="fg"><label>Student ID</label>
          <input id="pl-sid" type="text" placeholder="e.g. SAHARCO/20250115/0001"
            style="font-family:monospace;text-transform:uppercase"
            oninput="this.value=this.value.toUpperCase()"
            onkeydown="if(event.key==='Enter')parentLogin()">
        </div>
        <div class="fg"><label>Your Phone Number</label>
          <input id="pl-phone" type="tel" placeholder="e.g. 08012345678"
            onkeydown="if(event.key==='Enter')parentLogin()">
        </div>
        <div id="pl-err" style="color:var(--danger);font-size:.8rem;min-height:1rem;margin-bottom:.5rem"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:.65rem"
          onclick="parentLogin()">View Financial Records →</button>
        <div style="text-align:center;margin-top:1rem;font-size:.8rem;color:var(--muted)">
          <a href="login.html" style="color:var(--brand2)">Staff login →</a>
        </div>
      </div>
    </div>`;
}

window.parentLogin = async function() {
  const sid   = ($('pl-sid')?.value||'').trim().toUpperCase();
  const phone = ($('pl-phone')?.value||'').trim();
  const errEl = $('pl-err');
  if (!sid)   { errEl.textContent='Please enter the Student ID.';   return; }
  if (!phone) { errEl.textContent='Please enter the phone number.'; return; }
  errEl.textContent = 'Verifying…';
  try {
    const resp = await api('/students/parent-verify/'+encodeURIComponent(sid));
    const student = resp.data || resp;
    const stored = (student.phone||student.parent_phone||'').replace(/\s/g,'').replace(/^(\+234|234)/,'0');
    const entered = phone.replace(/\s/g,'').replace(/^(\+234|234)/,'0');
    if (!stored || entered.slice(-8) !== stored.slice(-8)) {
      errEl.textContent = 'Phone does not match our records. Contact the school.'; return;
    }
    errEl.textContent = '';
    _role   = 'Parent';
    _wardId = sid;
    // Restore layout
    location.reload(); // simplest — boot will find the pre-set sid via URL
  } catch(e) { errEl.textContent = e.message; }
};

/* ═══════════════════════════════════════════════════════════
   SELECT STUDENT
═══════════════════════════════════════════════════════════ */
async function selectStudent(id) {
  if (!id) { _student=null; $('sfp-main').innerHTML='<div class="empty"><div class="empty-ico">👈</div><p>Select a student.</p></div>'; return; }
  try {
    const resp = await api('/students/'+encodeURIComponent(id)).catch(async ()=>{
      const s = await api('/student-finance/summary?sid='+encodeURIComponent(id)).catch(()=>null);
      return { data: s?.data?.student || { id, name: id } };
    });
    _student = resp.data || resp;

    /* sidebar card */
    const initials = (_student.name||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    $('stu-avatar').textContent = initials;
    $('stu-name').textContent   = _student.name;
    $('stu-meta').textContent   = `${_student.class_name||_student.class||''} ${_student.arm||''} · ${_student.id}`;
    $('stu-card').style.display = '';

    /* URL update */
    const url = new URL(location.href);
    url.searchParams.set('studentId', id);
    history.replaceState(null,'',url);

    loadBalance();
    switchView(_view);
  } catch(e) { toast('Error: '+e.message,'error'); }
}

async function loadBalance() {
  if (!_student) return;
  try {
    const r = await api('/student-finance/summary?sid='+encodeURIComponent(_student.id));
    const bal = parseFloat(r.data?.ledger?.balance||0);
    $('stu-balance').innerHTML = `<span class="balance-pill ${bal>0?'pill-owed':'pill-ok'}">${bal>0?'⚠ Owes '+fmt(bal):'✓ Account Clear'}</span>`;
    const n = r.data?.unpaid?.totalCount||0;
    const b = $('badge-unpaid');
    b.textContent = n; b.style.display = n>0?'':'none';
  } catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function switchView(v) {
  _view = v;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.view===v));
  if (!_student && v!=='class') { $('sfp-main').innerHTML='<div class="empty"><div class="empty-ico">👈</div><p>Select a student first.</p></div>'; return; }
  $('sfp-main').innerHTML = '<div class="loading">Loading…</div>';
  const map = {overview:renderOverview,charges:renderCharges,payments:renderPayments,
               levies:renderLevies,ledger:renderLedger,bursar:renderBursar,class:renderClassFinance};
  (map[v] || renderOverview)();
}

/* ═══════════════════════════════════════════════════════════
   VIEW — OVERVIEW
═══════════════════════════════════════════════════════════ */
async function renderOverview() {
  const main = $('sfp-main'); const sid = encodeURIComponent(_student.id);
  try {
    const [sumR, charR, levR] = await Promise.all([
      api('/student-finance/summary?sid='+sid),
      api('/student-finance/charges?sid='+sid),
      api('/student-finance/levies?sid='+sid),
    ]);

function addFeeRow() {
  const row = document.createElement('div');
  row.className = 'fee-row';
  row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;margin-bottom:.4rem';
  row.innerHTML = `<input class="fee-name" type="text" placeholder="Fee name" style="padding:.48rem .75rem;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem">
    <input class="fee-amt" type="number" placeholder="Amount ₦" min="0" style="padding:.48rem .75rem;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem">
    <button onclick="this.closest('.fee-row').remove()" style="background:#fee2e2;color:#991b1b;border:none;border-radius:8px;padding:.48rem .75rem;cursor:pointer;font-weight:700">✕</button>`;
  $('bt-fee-rows').appendChild(row);
}

async function submitBulkFees() {
  const term = $('bt-term')?.value;
  const session = $('bt-session')?.value;
  const rows = [...document.querySelectorAll('.fee-row')];
  const fees = rows.map(r=>({ name:r.querySelector('.fee-name')?.value?.trim(), amt:parseFloat(r.querySelector('.fee-amt')?.value||0) })).filter(f=>f.name&&f.amt>0);
  if (!fees.length) { toast('Add at least one fee','warning'); return; }
  let count=0;
  for (const f of fees) {
    try {
      await api('/student-finance/charge?sid='+encodeURIComponent(_student.id),{ method:'POST', body:{ feeType:f.name, amount:f.amt, term, session, status:'Unpaid', date:new Date().toISOString().slice(0,10) }});
      count++;
    } catch(e){ toast(`Failed: ${f.name} — ${e.message}`,'error'); }
  }
  toast(`✅ ${count} fee(s) assigned`,'success');
  loadBalance();
}

async function submitPayAll() {
  const amount = parseFloat($('pa-amount')?.value||0);
  const date   = $('pa-date')?.value;
  const method = $('pa-method')?.value;
  const ref    = $('pa-ref')?.value||null;
  if (!amount||!date){ toast('Amount and date required','error'); return; }
  try {
    const r = await api('/student-finance/pay-all?sid='+encodeURIComponent(_student.id),{ method:'POST', body:{amount,date,method,reference:ref}});
    toast(`✅ ${r.data?.cleared||0} charges cleared`,'success');
    loadBalance(); switchView('overview');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

    const students = r.data||[];
    const totalOwed = students.reduce((s,st)=>s+parseFloat(st.balance||0),0);
    const cleared   = students.filter(s=>parseFloat(s.balance||0)<=0).length;
    out.innerHTML = `

        ${[['Students',students.length,'#1e3a5f'],['Total Owed',fmt(totalOwed),totalOwed>0?'#dc2626':'#16a34a'],

            <td>${s.arm||'—'}</td>

            <td style="color:${ok?'#16a34a':'#dc2626'};font-weight:700">${fmt(b)}</td>
            <td><span class="badge ${ok?'b-paid':'b-unpaid'}">${ok?'Clear':'Owes'}</span></td>

          </tr>`}).join('')}</tbody>

function goToStudent(id) {

/* ═══════════════════════════════════════════════════════════
   RECEIPT GENERATOR
═══════════════════════════════════════════════════════════ */
function printReceipt(p) {
  const school = _info.school_name||'Sacred Heart College Eziukwu Aba';
  const principal = _info.principal_name||'The Principal';
  const addr = _info.school_address||'Eziukwu Road, Aba, Abia State';
  const amt = parseFloat(p.amount||p.amount_paid||0);
  const rcpNo = 'RCP-'+String(p.id||'').replace(/\D/g,'').slice(-6).padStart(6,'0')+'-'+new Date().getFullYear();
  const status = p.status||(amt>0?'Paid':'Unpaid');
  const sc = status==='Paid'?'#16a34a':'#d97706';
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt ${rcpNo}</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#f1f5f9;padding:1.5rem}
  .rc{background:#fff;max-width:500px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.15)}
  .hdr{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;padding:1.75rem;text-align:center}
  .hdr img{width:52px;height:52px;border-radius:50%;object-fit:contain;margin-bottom:.5rem}
  .hdr h1{font-size:1rem;font-weight:800}.hdr p{font-size:.73rem;opacity:.8;margin-top:.2rem}
  .strip{display:flex;justify-content:space-between;align-items:center;padding:.65rem 1.5rem;background:${sc}18;border-bottom:2px solid ${sc}44}
  .rno{font-size:.75rem;color:#6b7280;font-family:monospace;font-weight:600}
  .st{background:${sc};color:#fff;border-radius:9999px;padding:.2rem .85rem;font-size:.75rem;font-weight:800}
  .body{padding:1.4rem 1.5rem}
  .sec{margin-bottom:1rem}
  .sec-lbl{font-size:.66rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem;border-bottom:1px solid #f1f5f9;padding-bottom:.25rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
  .row{display:flex;flex-direction:column;gap:.06rem}
  .lbl{font-size:.68rem;color:#9ca3af}
  .val{font-size:.85rem;font-weight:600}
  .amt-box{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:1rem 1.2rem;
    display:flex;justify-content:space-between;align-items:center;margin:.85rem 0}
  .amt-box .big{font-size:1.7rem;font-weight:800;color:#1e3a5f}
  .footer{background:#f8fafc;border-top:1px solid #e2e8f0;padding:.85rem 1.5rem;font-size:.7rem;color:#9ca3af;text-align:center}
  .no-print{text-align:center;margin-bottom:1rem;display:flex;gap:.5rem;justify-content:center}
  @media print{body{background:#fff;padding:0}.rc{box-shadow:none;max-width:100%;border-radius:0}.no-print{display:none}}</style>
  </head><body>
  <div class="no-print">
    <button onclick="window.print()" style="background:#1e3a5f;color:#fff;border:none;padding:.5rem 1.2rem;border-radius:8px;cursor:pointer;font-weight:700">🖨 Print</button>
    <button onclick="window.close()" style="background:#e5e7eb;color:#374151;border:none;padding:.5rem 1.2rem;border-radius:8px;cursor:pointer;font-weight:700">✕ Close</button>
  </div>
  <div class="rc">
    <div class="hdr">
      <img src="images/sahaco logo.jpg" onerror="this.style.display='none'">
      <h1>${school}</h1>
      <p>Official Payment Receipt · ${addr}</p>
    </div>
    <div class="strip"><span class="rno">Receipt: ${rcpNo}</span><span class="st">${status.toUpperCase()}</span></div>
    <div class="body">
      <div class="sec"><div class="sec-lbl">Student</div>
        <div class="grid">
          <div class="row"><span class="lbl">Name</span><span class="val">${p.student_name||_student?.name||'—'}</span></div>
          <div class="row"><span class="lbl">Student ID</span><span class="val" style="font-family:monospace;font-size:.78rem">${p.student_id||_student?.id||'—'}</span></div>
          <div class="row"><span class="lbl">Class</span><span class="val">${(p.class_name||'')+' '+(p.student_arm||'')}</span></div>
          <div class="row"><span class="lbl">Term</span><span class="val">${p.term||'—'}</span></div>
        </div>
      </div>
      <div class="sec"><div class="sec-lbl">Payment</div>
        <div class="grid">
          <div class="row"><span class="lbl">Fee Description</span><span class="val">${p.fee_type}</span></div>
          <div class="row"><span class="lbl">Date</span><span class="val">${new Date(p.payment_date||Date.now()).toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'})}</span></div>
          <div class="row"><span class="lbl">Method</span><span class="val">${p.method||'Cash'}</span></div>
          <div class="row"><span class="lbl">Reference</span><span class="val">${p.reference||rcpNo}</span></div>
        </div>
      </div>
      <div class="amt-box">
        <div><div style="font-size:.75rem;color:#6b7280">Amount Paid</div>
          <div style="font-size:.75rem;color:${sc};margin-top:.15rem">${status==='Paid'?'Fully settled ✓':'Partial payment'}</div>
        </div>
        <div class="big">₦${amt.toLocaleString('en-NG',{minimumFractionDigits:2})}</div>
      </div>
      <div style="font-size:.7rem;color:#9ca3af;text-align:center">Computer-generated receipt. Contact the school bursar for queries.</div>
    </div>
    <div class="footer">Principal: ${principal} · Generated: ${new Date().toLocaleString('en-NG')}</div>
  </div></body></html>`;
  const w = window.open('','_blank','width=580,height=760,scrollbars=yes');
  if (w){ w.document.write(html); w.document.close(); }
  else toast('Allow popups to print receipts','warning');
}
